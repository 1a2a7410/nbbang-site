<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>N빵 정산</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <main class="app-shell">
    <section id="loginScreen" class="screen login-screen">
      <div class="brand-card">
        <div class="brand-icon">₩</div>
        <h1>N빵 정산</h1>
        <p>정산 이름을 입력하면 같은 이름의 정산방으로 접속합니다.</p>

        <label class="field-label" for="settlementNameInput">정산 이름을 입력하세요</label>
        <input id="settlementNameInput" class="text-input" type="text" autocomplete="off" placeholder="정산 이름을 입력하세요" />

        <button id="enterBtn" class="primary-btn">입장하기</button>

        <div id="recentWrap" class="recent-wrap hidden">
          <label class="field-label" for="recentSelect">최근 정산 이름</label>
          <select id="recentSelect" class="text-input">
            <option value="">최근 정산 이름 선택</option>
          </select>
        </div>
      </div>
    </section>

    <section id="mainScreen" class="screen main-screen hidden">
      <header class="top-bar">
        <div>
          <div class="small-title">현재 정산</div>
          <h2 id="currentSettlementName">-</h2>
        </div>
        <button id="changeRoomBtn" class="ghost-btn">변경</button>
      </header>

      <section class="summary-card">
        <div>
          <span class="summary-label">등록된 인원</span>
          <strong id="memberCount">0명</strong>
        </div>
        <div>
          <span class="summary-label">정산 내역</span>
          <strong id="expenseCount">0건</strong>
        </div>
      </section>

      <section class="list-section">
        <div class="section-title-row">
          <h3>정산 내역</h3>
          <span>날짜순으로 정산 내역이 표시됩니다.</span>
        </div>
        <div id="expenseList" class="expense-list"></div>
      </section>

      <nav class="bottom-nav" aria-label="하단 버튼">
        <button id="addExpenseBtn">정산추가</button>
        <button id="deleteExpenseBtn">정산삭제</button>
        <button id="checkSettlementBtn">정산확인</button>
        <button id="manageMembersBtn">인원추가</button>
      </nav>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button id="modalCloseBtn" class="icon-btn" aria-label="닫기">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
